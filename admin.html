<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>İzci Kurye · Yönetim</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#0f1114;--card:#181b20;--tx:#f2f4f8;--mut:#98a0ab;--ok:#5baa7e;--go:#ff4d4d;--warn:#f59e0b;--err:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
.wrap{max-width:1300px;margin:0 auto;padding:12px}
.hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.hd h3{margin:0;flex:1}
button,input,select{font:inherit;border-radius:10px;border:1px solid #333a47;background:var(--card);color:var(--tx);padding:9px 12px}
button{cursor:pointer;border:0;background:#2b3240;font-weight:600}
.hd{position:sticky;top:0;z-index:2000;background:var(--bg);padding:8px 0;margin-top:-4px;box-shadow:0 6px 8px -6px #000a}
.bar button,.bar input,.bar .mut{flex-shrink:0;white-space:nowrap}
.bar #rfmsg{flex-shrink:1;min-width:0;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.hd button[data-t]{border:1.5px solid transparent;transition:box-shadow .2s,border-color .2s}
.hd button[data-t].on{border-color:#ff7a7a;box-shadow:0 0 6px #ff4d4d44}
button.on{background:var(--go);color:#0f1114;font-weight:700}
button:disabled{opacity:.6;cursor:wait}
.layout{display:grid;grid-template-columns:310px 1fr;gap:12px;align-items:start}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{order:2}}
h4{margin:2px 0 8px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
#map{height:62vh;border-radius:14px;margin-bottom:12px}
#ol{max-height:78vh;overflow:auto}
.oc{background:var(--card);border-radius:10px;padding:7px 10px;margin-bottom:6px;font-size:13px}
.oc.un{border-left:4px solid var(--warn)}
.r1{display:flex;gap:6px;align-items:center}
.r1 .rg{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}
.ad{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.oc select{width:100%;margin-top:4px;padding:5px 8px;font-size:13px}
.card{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.card.un{border-left:4px solid var(--warn)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mut{color:var(--mut)} .err{color:var(--err)} .ok{color:var(--ok)}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:#2b3240;white-space:nowrap}
.badge.yolda{background:#1d4ed8}.badge.bekliyor{background:#7a2d2d}.badge.sorunlu{background:#92400e}
.cd{width:22px;height:22px;border-radius:50%;border:3px solid #0f1115;box-shadow:0 0 0 2px #fff}
.cl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.cl .card{margin:0}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
th,td{padding:10px;text-align:right;border-bottom:1px solid #2b3240}
th:first-child,td:first-child{text-align:left}
tfoot td{font-weight:700;background:#222834}
.scroll{overflow-x:auto}
.age{font-size:11px;padding:2px 6px;border-radius:99px;background:#2b3240;white-space:nowrap}
.age.warn{background:#92400e}.age.late{background:#b91c1c}
.oc.late{border-left:4px solid var(--err)}
.r2{display:flex;gap:4px;margin-top:4px}
.oc .r2 select{margin-top:0;width:auto;flex:1;min-width:0}
.r2 .sm{padding:5px 8px;font-size:12px;white-space:nowrap}
/* --- minimal / geniş harita --- */
.wrap{max-width:none;padding:6px 10px}
.hd{gap:5px;margin-bottom:5px}
.hd h3{font-size:13px;font-weight:600;color:var(--mut)}
.hd h3.brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800;color:var(--tx);letter-spacing:-.3px}.hd h3.brand .bm{width:28px;height:28px;border-radius:9px;background:var(--go);display:grid;place-items:center}
button{padding:4px 10px;font-size:12px;border-radius:7px}
input,select{padding:4px 8px;font-size:13px;border-radius:7px}
h4{font-size:12px;margin:0 0 5px;color:var(--mut)}
.card{padding:6px 10px;margin-bottom:5px;font-size:13px}
.layout{grid-template-columns:350px 1fr;grid-template-rows:minmax(0,1fr);gap:8px;height:calc(100vh - 44px)}
.side{overflow:auto;min-height:0}
#ol{max-height:none;overflow:visible}
.main{display:flex;flex-direction:column;min-height:0}
#map{flex:1;height:auto;min-height:300px;margin:0;border-radius:10px}
.oc{font-size:12px;padding:5px 8px;margin-bottom:4px}
.bar{margin-bottom:4px;gap:6px}
.strip{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 5px}
.lg{margin:0;font-size:11px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:var(--card);border-radius:99px;padding:2px 9px;font-size:12px;white-space:nowrap}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
@media(min-width:851px){.mapwrap{position:relative;flex:1;min-height:300px;display:flex}.mapwrap #map{flex:1}}
.mapwrap{position:relative}
.mapov{position:absolute;top:56px;right:10px;z-index:900;width:178px;max-height:calc(100% - 68px);overflow:auto;padding:6px 8px;border-radius:10px;
  background:rgba(14,16,15,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:11px}
.mapov .chips{display:grid;gap:2px;margin-bottom:4px}
.mapov .chip{background:none;padding:0;white-space:normal;font-size:11px;line-height:1.3;color:#fff;text-shadow:0 1px 2px #000a}
.mapov .chip .mut,.mapov .lg b{color:rgba(255,255,255,.7)}
.mapov .chip i{width:8px;height:8px}
.mapov .lg{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin:0;padding-top:4px;border-top:1px solid rgba(255,255,255,.14);font-size:10.5px;color:#fff}
.mapov .lg b{grid-column:1/-1;font-weight:600;margin-top:2px}
.mapov .lg span{grid-column:1/-1}
.mapov .lg i{width:8px;height:8px;margin-right:5px}.mapov .lg i.c{box-shadow:0 0 0 1.5px #fff}
.cv{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.cv svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
th,td{padding:6px 8px;font-size:13px}
.main{position:relative}
#fx,#si{position:absolute;left:10px;bottom:30px;z-index:1100;max-width:340px}
#fx:empty,#si:empty{display:none}
#fx .card,#si .card{box-shadow:0 2px 10px rgba(0,0,0,.5);margin-bottom:6px}
@media(max-width:850px){.layout{display:block;height:auto}.side{max-height:38vh;margin-top:8px}.main{display:block}#map{height:62vh;flex:none}.mapov{position:static;width:auto;margin-top:6px;background:var(--card)}}
/* --- harita tüm boş yüksekliği kullansın --- */
.layout{align-items:stretch}
.wrap.live{display:flex;flex-direction:column;height:100vh}
.wrap.live .layout{flex:1;height:auto;min-height:0}
@media(max-width:850px){.wrap.live{display:block;height:auto}.wrap.live .layout{display:block}}

/* --- giriş ekranı + ana tema (koyu, adaçayı yeşili) --- */
.au{max-width:340px;margin:0 auto;padding-top:7vh;text-align:center}
.au .logo{width:92px;height:92px;border-radius:50%;background:var(--go);display:grid;place-items:center;margin:0 auto 18px}
.au h1{margin:0;font-size:30px;letter-spacing:-.5px}
.au .sub{color:var(--mut);margin:6px 0 34px}
.au .f{display:block;text-align:left;font-weight:600;margin:0 0 8px}
.au .in{position:relative;margin:0 0 18px}
.au .in svg.ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.au .in input{width:100%;padding:15px 46px;margin:0;border-radius:14px;border:1px solid #38383a;background:var(--card);color:var(--tx);font-size:17px}
.au .in input:focus{outline:0;border-color:var(--go)}
.au .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut);padding:10px;line-height:0}
.au .eye svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.au .rem{display:flex;gap:10px;align-items:center;margin:0 0 22px;font-size:15px;color:var(--mut);text-align:left}
.au .rem input{width:18px;height:18px;margin:0;accent-color:var(--go)}
.au .gobtn{width:100%;padding:15px;border:0;border-radius:14px;background:var(--go);color:#0d1a12;font-size:18px;font-weight:700}
.au .er{color:var(--err);margin:0 0 14px}

/* --- Sipariş Yönetimi --- */
.omt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.omt .srch{position:relative;flex:1;min-width:220px;max-width:420px}
.omt .srch input{width:100%;padding:9px 12px 9px 36px;font-size:14px;border-radius:12px;border:1px solid #2a2a28;background:var(--card)}
.omt .srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round}
.seg{display:flex;gap:2px;background:var(--card);border:1px solid #2a2a28;border-radius:12px;padding:3px}
.seg button{background:none;color:var(--mut);padding:6px 14px;font-size:13px;border-radius:9px}
.seg button.on{background:#2a2a28;color:var(--warn)}
.omc{background:var(--card);border:1px solid #2a2a28;border-radius:16px;overflow:hidden}
table.omtb{background:none;border-radius:0}
.omtb th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:14px 14px;border-bottom:1px solid #2a2a28;white-space:nowrap}
.omtb td{text-align:left;padding:14px;border-bottom:1px solid #232322;vertical-align:middle;font-size:14px}
.omtb tr:last-child td{border-bottom:0}
.omtb tbody tr:hover{background:#20201e}
.omtb th:last-child,.omtb td:last-child{text-align:right}
.omtb .no{color:var(--warn);font-weight:700;white-space:nowrap}
.omtb .nm{font-weight:600}.omtb .sub{color:var(--mut);font-size:13px}
.omtb .ad{white-space:normal;max-width:320px;color:#d6d6d8}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 11px;border-radius:99px;border:1px solid}
.pill.bekliyor{color:#fca5a5;background:#3b1a1a;border-color:#7a2d2d}
.pill.yolda{color:#fcd34d;background:#3a2c0e;border-color:#7c5a12}
.pill.teslim{color:#86efac;background:#13301f;border-color:#256b43}
.pill.sorunlu{color:#fdba74;background:#3a2410;border-color:#92400e}
.pill.iptal{color:#d4d4d8;background:#2a2a28;border-color:#3f3f46}
.pen{background:#2a2a28;width:34px;height:34px;padding:0;border-radius:9px;display:inline-grid;place-items:center}
.ac{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.tsl{background:var(--go);color:#0d1a12;font-weight:700;font-size:12px;padding:5px 12px;border-radius:8px}
.pen svg{width:16px;height:16px;stroke:var(--warn);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pm{font-size:12px}
#mdl{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:3000;display:flex;align-items:center;justify-content:center;padding:14px}
#mdl .bx{background:var(--card);border:1px solid #2a2a28;border-radius:16px;width:min(560px,100%);max-height:94vh;overflow:auto;padding:16px}
#mdl label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
#mdl input,#mdl select,#mdl textarea{width:100%;font-size:14px;padding:8px 10px;border-radius:9px;border:1px solid #38383a;background:#121211;color:var(--tx)}
#mdl textarea{resize:vertical;font:inherit}
#mdl .mt{display:flex;gap:6px;margin:10px 0}
#mdl .mt button{flex:1;padding:8px}
#mmap{height:300px;border-radius:10px;margin:8px 0}

/* --- Gün Sonu (rapor) --- */
.rp{--cn:#199e70;--ck:#3987e5;--co:#d95926;--ac:#5baa7e;display:block}
.rtb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid #2a2a28;border-radius:14px;padding:10px 12px;margin:6px 0 12px}
.rtb .seg{border:0;padding:0;background:none}
.rtb .seg button{background:#232322}
.rtb .seg button.on{background:var(--go);color:#0f1114}
.rtb .dt{display:flex;gap:6px;align-items:center;color:var(--mut)}
.rtb .sp{flex:1}
.rtb label{color:var(--mut);font-size:12px;display:flex;gap:6px;align-items:center}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
.kt{background:var(--card);border:1px solid #2a2a28;border-radius:14px;padding:14px 16px}
.kt .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);display:flex;gap:7px;align-items:center}
.kt .l i{width:9px;height:9px;border-radius:3px;display:inline-block}
.kt .v{font-size:28px;font-weight:700;margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kt .v small{font-size:15px;font-weight:600;color:var(--mut);margin-left:2px}
.kt .s{font-size:12px;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1.25fr;gap:12px;margin-top:12px}
@media(max-width:900px){.g2{grid-template-columns:1fr}}
.pn{background:var(--card);border:1px solid #2a2a28;border-radius:16px;padding:16px 18px;margin-top:12px;min-width:0}
.g2 .pn{margin-top:0}
.pn h5{margin:0;font-size:14px;font-weight:600;color:var(--tx)}
.pn .hs{font-size:12px;color:var(--mut);margin:2px 0 14px}
.sk{display:flex;gap:2px;height:30px}
.sk div{min-width:3px;transition:filter .12s}
.sk div:first-child{border-radius:6px 0 0 6px}.sk div:last-child{border-radius:0 6px 6px 0}.sk div:only-child{border-radius:6px}
.sk div:hover,.hb i:hover,.vb b:hover,.hm td[data-tip]:hover{filter:brightness(1.25)}
.lgd{margin-top:14px;display:grid;gap:9px}
.lgd .it{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;font-size:13px}
.lgd .it i{width:12px;height:12px;border-radius:3px}
.lgd .it b{font-variant-numeric:tabular-nums}.lgd .it span.m{color:var(--mut);font-size:12px;margin-left:8px}
.hb{display:grid;gap:9px;max-height:330px;overflow:auto}
.hb .r{display:grid;grid-template-columns:112px 1fr 46px;gap:10px;align-items:center;font-size:13px}
.hb .r .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{background:#262624;border-radius:0 5px 5px 0;height:16px}
.hb i{display:block;height:100%;background:var(--ac);border-radius:0 5px 5px 0;min-width:3px;transition:filter .12s}
.hb .r .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.vb{position:relative;height:210px;margin:0 0 4px 34px}
.vb .gl{position:absolute;left:0;right:0;border-top:1px solid #2a2a28}
.vb .gl span{position:absolute;left:-34px;top:-8px;font-size:11px;color:var(--mut);width:28px;text-align:right}
.vb .bars{position:absolute;inset:0;display:flex;gap:4px;align-items:flex-end;justify-content:center}
.vb .col{flex:1;max-width:72px;height:100%;display:flex;align-items:flex-end;justify-content:center}
.vb b{display:block;width:100%;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px;transition:filter .12s}
.vx{display:flex;gap:4px;justify-content:center;margin:6px 0 0 34px}
.vx span{flex:1;max-width:72px;text-align:center;font-size:11px;color:var(--mut);white-space:nowrap;overflow:visible}
.cvt{width:100%;border-collapse:collapse;background:none}
.cvt th{text-align:right;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:10px 12px;border-bottom:1px solid #2a2a28;white-space:nowrap}
.cvt td{text-align:right;padding:12px;border-bottom:1px solid #232322;font-variant-numeric:tabular-nums;white-space:nowrap}
.cvt th:first-child,.cvt td:first-child{text-align:left}
.cvt tbody tr:hover{background:#20201e}
.cvt tfoot td{font-weight:700;border-top:1px solid #38383a;border-bottom:0;background:#20201e}
.cvt tfoot td:first-child{border-radius:0 0 0 10px}.cvt tfoot td:last-child{border-radius:0 0 10px 0}
.av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#2a2a28;font-weight:700;font-size:13px;margin-right:10px;color:var(--warn)}
.mb{display:inline-block;height:6px;border-radius:3px;background:var(--ac);vertical-align:middle;margin-right:8px;min-width:3px}
.cvt .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.hm{border-collapse:separate;border-spacing:3px;width:100%}
.hm th{font-size:12px;font-weight:600;color:var(--mut);padding:4px 6px;text-align:center;white-space:nowrap}
.hm th:first-child{text-align:left}
.hm td{text-align:center;padding:8px 6px;border-radius:6px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;transition:filter .12s}
.hm td:first-child{text-align:left;color:var(--mut);background:none;font-weight:500;padding-left:0}
.empty{padding:40px 10px;text-align:center;color:var(--mut)}
#tip{position:fixed;z-index:4000;pointer-events:none;background:#242422;border:1px solid #3a3a38;border-radius:10px;padding:8px 11px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.5);display:none;max-width:260px}
#tip .t{font-weight:600;margin-bottom:4px;color:var(--mut)}
#tip .r{display:flex;justify-content:space-between;gap:16px}
#tip .r b{font-variant-numeric:tabular-nums}
.pm.nakit{color:#199e70}.pm.kart{color:#3987e5}.pm.online{color:#d95926}

/* canlı sipariş kartı */
#ol .oc{background:var(--card);border:1px solid #2a2f2c;border-radius:12px;padding:9px 11px;margin-bottom:7px;font-size:12px;display:grid;gap:6px}
#ol .oc.un{border-left:4px solid var(--warn)}#ol .oc.late{border-left:4px solid var(--err)}
#ol .o1{display:flex;align-items:center;gap:6px}
#ol .no{font-weight:700;font-size:11.5px;color:#f5b84a;background:#2d2410;border:1px solid #4a3a16;border-radius:7px;padding:2px 7px}
#ol .st{font-size:10.5px;font-weight:600;padding:1px 8px;border-radius:99px;border:1px solid #4a3a16;color:#f5b84a;background:#2d2410}
#ol .st.yolda{color:#5baa7e;border-color:#1f4a31;background:#12281c}#ol .st.sorunlu{color:#ef5b5b;border-color:#512424;background:#2c1515}
#ol .am{margin-left:auto;font-size:13px;font-weight:700}
#ol .o2{display:flex;align-items:center;justify-content:space-between;gap:8px}
#ol .cn{font-size:13px;font-weight:600}
#ol .pc{font-size:10.5px;font-weight:600;padding:1px 8px;border-radius:7px;white-space:nowrap}
#ol .pc.nk{background:#12281c;color:#5baa7e}#ol .pc.kt{background:#12202e;color:#5b9bd5}#ol .pc.on{background:#2d2410;color:#f5b84a}
#ol .ab{border:1px solid #2a2f2c;background:#121513;border-radius:9px;padding:6px 9px;color:#b4bcb7;font-size:11.5px;line-height:1.4;white-space:normal}
#ol .o3{display:flex;align-items:center;justify-content:space-between;gap:8px}
#ol .fx{background:none;border:0;color:var(--mut);display:flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 0;white-space:nowrap}
#ol .fx:hover{color:var(--tx)}
#ol .fx svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#ol .o3 select{width:auto;flex:1;min-width:0;max-width:160px;margin:0;padding:5px 7px;font-size:12px;border-radius:8px}
.omtb .pc{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:7px;white-space:nowrap;display:inline-block}

<body><div class="wrap" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="config.js"></script>
<script>
if (typeof SUPABASE_URL === 'undefined') document.body.innerHTML = '<p style="padding:20px">config.js bulunamadı.</p>';

// Sahip panelinden "yönetici olarak gir": oturum kodu adres kısmında gelir (#t=...), hemen silinir
try { const h = location.hash.match(/^#t=([0-9a-f-]{36})$/i); if (h) { localStorage.setItem('atok', h[1]); history.replaceState(null, '', location.pathname); } } catch (e) {}
let tok = localStorage.getItem('atok'), tab = 'live', data = { couriers: [], orders: [], delivered: [], restaurant: null }, report = { couriers: [], days: [] }, from = '', to = '';
let warnMin = +localStorage.getItem('warnMin') || 20, lateMin = +localStorage.getItem('lateMin') || 35, fee = +localStorage.getItem('fee') || 0;
let rq = 'today', health = null, analiz = null, om = { rows: [], day: '', q: '', f: 'all' }, mm = null;
let info = null;
let map = null, layer = null, first = true, msg = '', couriers = [], fixLayer = null, fixing = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tl = n => Number(n || 0).toLocaleString('tr-TR', { maximumFractionDigits: 2 }) + ' ₺';
const ago = s => s == null ? 'konum yok' : s < 60 ? s + ' sn önce' : Math.round(s / 60) + ' dk önce';

async function rpc(fn, args = {}) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args)
  });
  const j = await r.json().catch(() => null);
  if (!r.ok) {
    if (j && /oturum|devre dışı/.test(j.message || '')) { msg = j.message; logout(); }
    throw new Error((j && j.message) || 'Bağlantı hatası');
  }
  return j;
}

async function login() {
  try {
    const u = $('#u').value.trim();
    try { localStorage.setItem('auser', u); } catch (e) {}
    const j = await rpc('adk_admin_login', { p_user: u, p_pass: $('#p').value });
    if (!j.ok) { msg = j.error || 'Giriş yapılamadı'; return render(); }
    tok = j.token; info = j.info; localStorage.setItem('atok', tok); msg = '';
    setTab('live');
  } catch (e) { msg = e.message; render(); }
}
function logout() {
  tok = null; info = null; localStorage.removeItem('atok');
  if (map) { map.remove(); map = null; }
  render();
}
function setTab(t) {
  tab = t; fixing = null;
  // her sekme kendi varsayılan dönemiyle açılır (Gün Sonu: bugün, Analiz: bugün, Yoğunluk: bu ay)
  if (t === 'report') quick('today'); else if (t === 'analiz') quick('today'); else if (t === 'density') quick('month');
  if (map) { map.remove(); map = null; }
  if (dmap) { dmap.remove(); dmap = null; }
  render();
  loadHealth();
  t === 'live' ? load() : t === 'report' ? loadReport() : t === 'analiz' ? loadAnaliz() : t === 'payroll' ? loadPayroll() : t === 'density' ? loadDensity() : t === 'customers' ? loadCustomers() : t === 'orders' ? loadOrders() : loadCouriers();
}

async function loadHealth() {
  if (!tok) return;
  try { health = await rpc('adk_admin_health', { p_token: tok }); } catch (e) { return; }
  paintHealth();
}
function paintHealth() {
  const h = $('#hl'); if (!h || !health) return;
  const s = health.last_poll_sec, m = s == null ? null : Math.round(s / 60);
  const bad = s == null || s > 300, warn = s != null && s > 180;
  h.style.color = bad ? '#ef4444' : warn ? '#f59e0b' : '#22c55e';
  h.textContent = s == null ? '● Adisyo: henüz veri yok' : bad ? `● Adisyo bağlantısı kesik! Son veri ${m} dk önce` : `● Adisyo: ${s < 60 ? s + ' sn' : m + ' dk'} önce`;
}
async function loadAnaliz() {
  if (!from) quick('today');
  try { analiz = await rpc('adk_admin_analiz', { p_token: tok, p_from: from, p_to: to, p_late: lateMin, p_far: 300 }); msg = ''; }
  catch (e) { msg = e.message; analiz = null; }
  render();
}
async function load() {
  if (!tok || tab !== 'live') return;
  loadHealth();
  try { data = await rpc('adk_admin_live', { p_token: tok }); msg = ''; drawLive(); }
  catch (e) { msg = e.message; const m = $('#msg'); if (m) m.textContent = msg; }
}
let repOrders = [], openRc = {};
async function loadReport() {
  if (!from) quick('today');
  try {
    const [rp, ro] = await Promise.all([rpc('adk_admin_range_report', { p_token: tok, p_from: from, p_to: to }),
      rpc('adk_admin_courier_orders', { p_token: tok, p_from: from, p_to: to }).catch(() => [])]);
    report = rp; repOrders = ro || []; msg = '';
  }
  catch (e) { msg = e.message; report = { couriers: [], days: [] }; repOrders = []; }
  render();
}
async function loadCouriers() {
  try { couriers = await rpc('adk_admin_couriers', { p_token: tok }); msg = ''; breakMin = await rpc('adk_admin_break_cfg', { p_token: tok }); }
  catch (e) { msg = e.message; }
  render();
}
let breakMin = 15;
async function saveBreakMin() {
  const v = parseInt(($('#bm') || {}).value, 10);
  try { breakMin = await rpc('adk_admin_break_cfg', { p_token: tok, p_min: v }); alert('Mola süresi ' + breakMin + ' dk olarak kaydedildi'); }
  catch (e) { alert(e.message); }
  render();
}
async function updCourier(id, name, active) {
  try { await rpc('adk_admin_update_courier', { p_token: tok, p_courier_id: id, p_name: name, p_active: active }); }
  catch (e) { alert(e.message); }
  loadCouriers();
}
async function addCourier() {
  const n = $('#nc-n').value.trim(), ph = $('#nc-p').value.trim(), pin = $('#nc-pin').value.trim();
  if (!n || !pin) return alert('Ad ve PIN gerekli');
  try { await rpc('adk_admin_add_courier', { p_token: tok, p_name: n, p_phone: ph, p_pin: pin }); } catch (e) { return alert(e.message); }
  loadCouriers();
}
async function setPin(id) {
  const pin = prompt('Yeni PIN (4-8 rakam):');
  if (!pin) return;
  try { await rpc('adk_admin_set_pin', { p_token: tok, p_courier_id: id, p_pin: pin }); alert('PIN kaydedildi. Kurye yeniden giriş yapmalı.'); }
  catch (e) { alert(e.message); }
  loadCouriers();
}
let selAt = 0;
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('select[data-oid]')) selAt = Date.now(); });
async function assign(oid, cid) {
  try { await rpc('adk_admin_assign', { p_token: tok, p_order_id: oid, p_courier_id: cid }); } catch (e) { alert(e.message); }
  load();
}

// Adisyo'dan siparişleri hemen çek (cron'u beklemeden)
async function refreshOrders() {
  const b = $('#rf'), m = $('#rfmsg');
  if (!b) return;
  b.disabled = true; b.textContent = 'Güncelleniyor…'; m.textContent = '';
  try {
    const r = await fetch('/.netlify/functions/poll-adisyo?token=' + encodeURIComponent(tok));
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) m.textContent = 'Oturum geçersiz, yeniden giriş yap';
    else if (typeof j.orders === 'string') m.textContent = 'Adisyo kısa süre önce sorgulandı, birkaç sn sonra tekrar dene';
    else if (j.errors && j.errors.length) m.textContent = 'Hata: ' + j.errors[0];
    else m.textContent = 'Güncellendi (' + (j.orders ? j.orders.package_orders : 0) + ' paket)';
  } catch (e) { m.textContent = 'Bağlantı hatası'; }
  { const mm = $('#rfmsg'); if (mm) mm.title = mm.textContent; }
  const b2 = $('#rf'); if (b2) { b2.disabled = false; b2.textContent = '↻ Siparişleri Güncelle'; }
  load();
}

// ---------- Restoran / şube / şifre ----------
function branchChip() {
  if (!info) return '<span style="margin-left:auto"></span>';
  const imp = info.impersonated ? '<span class="chip" style="background:var(--go);color:#0f1114;font-weight:700" title="Sahip olarak giriş yaptın">Sahip girişi</span>' : '';
  const t = info.tenant ? esc(info.tenant.name) : '';
  if ((info.branches || []).length > 1)
    return `<span style="margin-left:auto"></span>${imp}<select id="brsel" title="${t}" style="max-width:200px">${info.branches.map(b => `<option value="${b.id}" ${info.branch && b.id === info.branch.id ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}</select>`;
  return `<span style="margin-left:auto"></span>${imp}<span class="chip" title="Restoran">${t}${info.branch && info.branch.name && info.branch.name !== 'Merkez' ? ' · ' + esc(info.branch.name) : ''}</span>`;
}
async function loadInfo() {
  try { info = await rpc('adk_admin_info', { p_token: tok }); render(); } catch (e) {}
}
async function switchBranch(id) {
  try { info = await rpc('adk_admin_switch_branch', { p_token: tok, p_branch: id }); location.reload(); }
  catch (e) { msg = e.message; render(); }
}
function pwDialog() {
  let m = $('#mdl'); if (!m) { m = document.createElement('div'); m.id = 'mdl'; document.body.appendChild(m); }
  m.innerHTML = `<div class="bx"><div class="row"><b>Şifreni değiştir</b><button data-mc="1">Kapat</button></div>
    ${info && info.impersonated ? '<p class="mut">Sahip girişinde şifre değiştirilemez.</p>' : `
    <label>Mevcut şifre</label><input id="pw0" type="password" autocomplete="current-password">
    <label>Yeni şifre (en az 6 karakter)</label><input id="pw1" type="password" autocomplete="new-password">
    <label>Yeni şifre (tekrar)</label><input id="pw2" type="password" autocomplete="new-password">
    <div id="pwm" class="err" style="min-height:20px"></div>
    <div class="mt"><button class="on" id="pwsave">Kaydet</button></div>`}</div>`;
}
async function pwSave() {
  const a = $('#pw0').value, b = $('#pw1').value, c = $('#pw2').value, m = $('#pwm');
  if (b.length < 6) { m.textContent = 'Yeni şifre en az 6 karakter olmalı'; return; }
  if (b !== c) { m.textContent = 'Yeni şifreler aynı değil'; return; }
  try { await rpc('adk_admin_change_password', { p_token: tok, p_old: a, p_new: b }); closeMdl(); msg = 'Şifre değişti'; render(); setTimeout(() => { msg = ''; const e = $('#msg'); if (e) e.textContent = ''; }, 3000); }
  catch (e) { m.textContent = e.message; }
}

// ---------- Sayfa iskeleti ----------
function render() {
  const app = $('#app'); setTimeout(paintHealth, 0); setTimeout(paintBell, 0);
  app.className = 'wrap' + (tok && tab === 'live' ? ' live' : '');
  if (!tok) {
    app.innerHTML = `<div class="au"><div class="logo"><svg width="52" height="52" viewBox="0 0 24 24" fill="#0f1114" aria-hidden="true"><path d="M12 2 20.5 20.5 12 16 3.5 20.5Z"/></svg></div><h1>İzci Kurye</h1><div class="sub">Yönetici paneli</div>${msg ? `<p class="er">${esc(msg)}</p>` : ''}
      <label class="f">Kullanıcı adı</label><div class="in"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Kullanıcı adı" value="${esc(localStorage.getItem('auser') || '')}"></div>
      <label class="f">Şifre</label><div class="in"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><input id="p" type="password" placeholder="Şifre" autocomplete="current-password"><button type="button" class="eye" data-a="eye" aria-label="Göster/gizle"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <button class="gobtn" id="go">Giriş Yap</button></div>`;
    return;
  }
  const head = `<div class="hd"><h3 class="brand"><span class="bm"><svg width="18" height="18" viewBox="0 0 24 24" fill="#0f1114" aria-hidden="true"><path d="M12 2 20.5 20.5 12 16 3.5 20.5Z"/></svg></span>İzci Kurye</h3>
    <button data-t="live" class="${tab === 'live' ? 'on' : ''}">Canlı</button>
    <button data-t="orders" class="${tab === 'orders' ? 'on' : ''}">Sipariş Yönetimi</button>
    <button data-t="report" class="${tab === 'report' ? 'on' : ''}">Gün Sonu</button>
    <button data-t="analiz" class="${tab === 'analiz' ? 'on' : ''}">Analiz</button>
    <button data-t="payroll" class="${tab === 'payroll' ? 'on' : ''}">Hakediş</button>
    <button data-t="density" class="${tab === 'density' ? 'on' : ''}">Yoğunluk</button>
    <button data-t="customers" class="${tab === 'customers' ? 'on' : ''}">Müşteriler</button>
    <button data-t="couriers" class="${tab === 'couriers' ? 'on' : ''}">Kuryeler</button>
    ${branchChip()}<span id="hl" class="chip"></span><button id="bell" class="bell" title="Kurye mesajları"></button>
    <button id="pw" title="Şifreni değiştir">Şifre</button><button id="out">Çıkış</button></div><div id="msg" class="err">${esc(msg)}</div>`;
  if (tab === 'live') {
    app.innerHTML = head + `<div class="layout">
      <aside class="side"><h4>Aktif siparişler <span id="latec" class="err" style="font-weight:700"></span></h4><div id="ol"></div></aside>
      <section class="main">
        <div id="fx"></div><div id="si"></div>
        <div class="bar"><button id="rf">↻ Siparişleri Güncelle</button><span id="rfmsg" class="mut"></span><span style="flex:1"></span><span class="mut">Uyarı / Geç:</span><input id="tw" type="number" min="1" value="${warnMin}" style="width:58px;padding:6px"><input id="tl" type="number" min="1" value="${lateMin}" style="width:58px;padding:6px"><span class="mut">dk</span><button id="rs">Restoranı işaretle</button><button id="fit">Restorana ortala</button></div>
        <div class="mapwrap"><div id="map"></div>
          <div class="mapov"><div id="cl" class="chips"></div>
            <div class="lg"><b>Kurye</b><span><i class="c" style="background:#1d5fd6"></i>Yolda</span><span><i class="c" style="background:#e8b400"></i>Dönüşte</span><span><i class="c" style="background:#16a34a"></i>Boşta</span>
              <b>Sipariş</b><span><i style="background:#ef4444"></i>Bekliyor</span><span><i style="background:#1d5fd6"></i>Yolda</span><span><i style="background:#facc15"></i>Teslim edildi</span></div></div></div>
      </section></div>`;
    map = L.map('map').setView([39.7477, 37.0179], 13);
    const st = (n, ext = 'png') => L.tileLayer('https://tiles.stadiamaps.com/tiles/' + n + '/{z}/{x}/{y}{r}.' + ext + '?api_key=45ed99b7-7dc5-4f6a-b68c-90dac8a82a02',
      { maxZoom: 20, attribution: '&copy; Stadia Maps &copy; OpenMapTiles &copy; OpenStreetMap' });
    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' });
    const bright = st('outdoors').addTo(map);   // varsayılan: Dış mekan
    L.control.layers({ 'Dış mekan': bright, 'Sade+yol (Bright)': st('osm_bright'), 'Çok sade (Smooth)': st('alidade_smooth'), 'Uydu': st('alidade_satellite', 'jpg'),
      'Standart OSM': osm }, null, { position: 'topright' }).addTo(map);
    let terr = 0;
    bright.on('tileerror', () => { if (++terr === 5) { map.removeLayer(bright); osm.addTo(map); } });   // anahtar sorunu olursa standart haritaya dön
    layer = L.layerGroup().addTo(map); first = true;
    new ResizeObserver(() => map && map.invalidateSize()).observe($('#map'));   // üstteki uyarılar açılıp kapanınca harita boyutu uyum sağlar
    fixLayer = L.layerGroup().addTo(map);
    map.on('click', e => {            // konum düzeltme modunda: haritada tek tıklama = yeni nokta (henüz kaydedilmez)
      if (!fixing) return;
      fixing.pt = e.latlng; fixLayer.clearLayers();
      L.marker(e.latlng, { icon: pinIcon('#a855f7'), zIndexOffset: 2000 }).addTo(fixLayer); drawFix();
    });
  } else if (tab === 'payroll') {
    app.innerHTML = head + drawPayroll();
  } else if (tab === 'density') {
    app.innerHTML = head + drawDensity(); initDensityMap();
  } else if (tab === 'customers') {
    app.innerHTML = head + drawCustomers();
  } else if (tab === 'couriers') {
    app.innerHTML = head + drawCouriers();
  } else if (tab === 'analiz') {
    app.innerHTML = head + drawAnaliz();
  } else if (tab === 'orders') {
    app.innerHTML = head + drawOrders();
  } else {

  }
}

// Harita her zaman restoranı merkez alır: tüm pinleri kapsayacak kadar uzaklaşır ama restoran ortada kalır
function fitAround(pts) {
  const R = data.restaurant;
  if (!R || R.lat == null) { if (pts && pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 16 }); return; }
  let dLat = 0.008, dLng = 0.008;                      // en az ~900 m yarıçap
  (pts || []).forEach(q => { dLat = Math.max(dLat, Math.min(Math.abs(q[0] - R.lat), 0.15)); dLng = Math.max(dLng, Math.min(Math.abs(q[1] - R.lng), 0.15)); });
  const z = map.getBoundsZoom([[R.lat - dLat, R.lng - dLng], [R.lat + dLat, R.lng + dLng]], false, L.point(60, 60));
  map.setView([R.lat, R.lng], Math.min(z + 2, 18));      // sığdırılan görünümden 2 kademe yakın, restoran ortada
}
// Kurye rengi: teslimatta = mavi, siparişi yok ve restorandan uzak = dönüşte (sarı), restoranda = yeşil
function courierState(c, outSet, R) {
  if (outSet.has(c.id)) return { col: '#1d5fd6', txt: 'teslimatta' };
  if (c.lat != null && R && R.lat != null) {
    if (c.active_orders > 0) return { col: '#1d5fd6', txt: 'siparişi var' };
    return distM(c.lat, c.lng, R.lat, R.lng) > 150 ? { col: '#e8b400', txt: 'restorana dönüyor' } : { col: '#16a34a', txt: 'restoranda' };
  }
  return { col: '#16a34a', txt: 'boşta' };
}
const outMin = o => o.local_status === 'yolda' && o.picked_at ? Math.max(0, Math.floor((Date.now() - new Date(o.picked_at).getTime()) / 60000)) : null;

// ---------- Konum düzeltme (iki adım: haritada tıkla -> Kaydet) ----------
const distM = (a, b, c, d) => {
  const t = x => x * Math.PI / 180, h = Math.sin(t(c - a) / 2) ** 2 + Math.cos(t(a)) * Math.cos(t(c)) * Math.sin(t(d - b) / 2) ** 2;
  return 12742000 * Math.asin(Math.sqrt(h));
};
function startFix(id) {
  const o = data.orders.find(x => x.adisyo_id === id);
  if (!o || !map) return;
  fixing = { id, no: o.order_no, lat: o.lat, lng: o.lng, pt: null };
  fixLayer.clearLayers();
  if (o.lat != null) map.setView([o.lat, o.lng], 17);
  map.getContainer().style.cursor = 'crosshair';
  drawFix();
}
function startRestFix() {
  if (!map) return;
  const R = data.restaurant;
  fixing = { rest: true, lat: R ? R.lat : null, lng: R ? R.lng : null, pt: null };
  fixLayer.clearLayers();
  map.getContainer().style.cursor = 'crosshair';
  drawFix();
}
function cancelFix() {
  fixing = null;
  if (fixLayer) fixLayer.clearLayers();
  if (map) map.getContainer().style.cursor = '';
  drawFix();
}
function drawFix() {
  const el = $('#fx'); if (!el) return;
  if (!fixing) { el.innerHTML = ''; return; }
  if (!fixing.pt) { el.innerHTML = `<div class="card" style="border-left:4px solid #a855f7"><b>${fixing.rest ? 'Restoran' : '#' + (fixing.no ?? '')} için doğru noktaya haritada tıkla</b> <button data-fxc="1">İptal</button></div>`; return; }
  const d = fixing.lat != null ? Math.round(distM(fixing.lat, fixing.lng, fixing.pt.lat, fixing.pt.lng)) : null;
  el.innerHTML = `<div class="card" style="border-left:4px solid #a855f7"><b>${fixing.rest ? 'Restoran' : '#' + (fixing.no ?? '')}</b> yeni konum işaretlendi` +
    (d != null ? ` · eski konuma <b class="${d > 2000 ? 'err' : ''}">${d >= 1000 ? (d / 1000).toFixed(1) + ' km' : d + ' m'}</b> uzaklıkta` : '') +
    ` <button class="on" data-fxs="1">Kaydet</button><button data-fxr="1">Yeniden seç</button><button data-fxc="1">İptal</button></div>`;
}
async function saveFix() {

  let te = 0; br.on('tileerror', () => { if (++te === 5) { map2.removeLayer(br); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map2); } });

// ---------- Rapor (gün / hafta / ay / aralık) ----------
const fmt = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  rq = k;
  const n = new Date(Date.now() - 5 * 3600 * 1000);                 // gün sınırı 05:00
  const t = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const add = (d, x) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + x);
  const dow = (t.getDay() + 6) % 7;                                  // hafta Pazartesi başlar
  let a = t, b = t;
  if (k === 'yesterday') a = b = add(t, -1);
  else if (k === 'week') a = add(t, -dow);
  else if (k === 'lastweek') { a = add(t, -dow - 7); b = add(t, -dow - 1); }
  else if (k === 'month') a = new Date(t.getFullYear(), t.getMonth(), 1);
  else if (k === 'lastmonth') { a = new Date(t.getFullYear(), t.getMonth() - 1, 1); b = new Date(t.getFullYear(), t.getMonth(), 0); }
  from = fmt(a); to = fmt(b);
}
const DOWN = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];

  const hopt = v => Array.from({ length: 24 }, (_, i) => `<option value="${i}" ${i === v ? 'selected' : ''}>${String(i).padStart(2, '0')}:00</option>`).join('');
  const bar = rangeBar(`<label>Saat <select id="dh1">${hopt(dH[0])}</select> – <select id="dh2">${hopt(dH[1])}</select></label>`);
  if (!dens) return `<div class="rp">${bar}<div class="pn"><div class="empty">Veri yok.</div></div></div>`;
  const days = Math.max(1, Number(dens.days) || 1), H = dens.hours || [], RG = dens.regions || [];
  const hm2 = Math.max(1, ...H.map(x => x.n / days)), hrs = Array.from({ length: 24 }, (_, h) => ({ h, v: ((H.find(x => x.h === h) || {}).n || 0) / days }));
  const hcols = hrs.map(x => `<div class="col"><b style="height:${x.v / hm2 * 100}%;${x.v ? '' : 'min-height:0'}" data-tip="${tipAttr(String(x.h).padStart(2, '0') + ':00', [['Günlük ort. sipariş', x.v.toFixed(1)], ['Gereken kurye', Math.ceil(x.v / perCour)]])}"></b></div>`).join('');
  const hx = hrs.map(x => `<span>${x.h % 3 === 0 ? String(x.h).padStart(2, '0') : ''}</span>`).join('');
  const peak = hrs.reduce((a, b) => b.v > a.v ? b : a, hrs[0]);
  const rmx = Math.max(1, ...RG.map(x => +x.n));
  const regs = RG.map(x => `<div class="r"><span class="n" title="${esc(x.region)}">${esc(x.region)}</span><div class="tr"><i style="width:${Math.round(x.n / rmx * 100)}%"></i></div><span class="c">${x.n}</span></div>`).join('') || '<div class="mut">Veri yok</div>';
  const nCells = (dens.cells || []).length;
  return `<div class="rp">${bar}
    <div class="g2 dg2"><div class="pn"><h5>Sipariş yoğunluğu haritası</h5><div class="hs">${nCells ? 'Koyu kırmızı = daha çok sipariş. Her kare yaklaşık 200 m. Müşteri bilgisi tutulmaz.' : 'Bu aralıkta konumlu sipariş yok. Harita bundan sonra gelen konumlu siparişlerle dolar.'}</div><div id="dmap"></div></div>
    <div style="display:grid;gap:12px;align-content:start">
      <div class="pn"><h5>Saate göre günlük ortalama sipariş</h5><div class="hs">En yoğun saat ${String(peak.h).padStart(2, '0')}:00 · ortalama ${peak.v.toFixed(1)} sipariş · yaklaşık ${Math.ceil(peak.v / perCour)} kurye gerekir</div>
        <div class="vb sm"><div class="bars">${hcols}</div></div><div class="vx">${hx}</div>
        <label class="mut" style="font-size:12px;display:flex;gap:6px;align-items:center;margin-top:8px">Bir kurye saatte <input id="pc" type="number" min="1" max="12" value="${perCour}" style="width:56px"> paket taşır</label></div>
      <div class="pn"><h5>Bölgeler</h5><div class="hs">Seçili saat aralığında en çok sipariş gelen bölgeler</div><div class="hb">${regs}</div></div></div></div></div>`;
}
function initDensityMap() {
  const el = $('#dmap'); if (!el) return;
  if (dmap) { dmap.remove(); dmap = null; }
  dmap = L.map('dmap').setView([39.7477, 37.0179], 13);
  const k = '?api_key=45ed99b7-7dc5-4f6a-b68c-90dac8a82a02';
  const t = L.tileLayer('https://tiles.stadiamaps.com/tiles/outdoors/{z}/{x}/{y}{r}.png' + k, { maxZoom: 20, attribution: '&copy; Stadia Maps &copy; OpenStreetMap' }).addTo(dmap);
  let terr = 0; t.on('tileerror', () => { if (++terr === 5) { dmap.removeLayer(t); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(dmap); } });
  const cells = (dens && dens.cells) || [], mx = Math.max(1, ...cells.map(c => +c.n)), pts = [];
  cells.forEach(c => {
    const f = c.n / mx, col = f > .66 ? '#dc2626' : f > .33 ? '#f97316' : '#facc15';
    L.rectangle([[c.lat - .001, c.lng - .001], [c.lat + .001, c.lng + .001]], { color: col, weight: 0, fillColor: col, fillOpacity: .25 + .5 * f })
      .bindTooltip(c.n + ' sipariş').addTo(dmap);
    pts.push([c.lat, c.lng]);
  });
  if (pts.length) dmap.fitBounds(pts, { padding: [30, 30], maxZoom: 15 });
  new ResizeObserver(() => dmap && dmap.invalidateSize()).observe(el);
}
